<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak 2026</title>
    <!-- Fonts optimize (Sirf wahi load honge jo zaroori hain) -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle, #004d40, #00251a);
            color: white; font-family: 'Poppins', sans-serif;
            text-align: center; overflow-x: hidden;
        }

        .ad-slot {
            margin: 10px auto;
            min-height: 250px;
            width: 300px;
            background: rgba(255,255,255,0.05); /* Loading indicator */
            display: flex; align-items: center; justify-content: center;
        }

        .falling-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .star {
            position: absolute; color: gold; font-size: 18px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .container { 
            position: relative; z-index: 1;
            max-width: 500px; margin: auto; padding: 10px; 
        }

        .from-name { 
            font-size: 24px; color: #ffeb3b; margin-top: 10px; 
            text-shadow: 2px 2px 8px #000;
        }

        .main-wish { 
            font-family: 'Great Vibes', cursive;
            font-size: 60px; margin: 10px 0;
            background: linear-gradient(to bottom, #cf9d38, #ffefbb, #cf9d38);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .eid-gif { 
            width: 100%; border-radius: 15px; 
            border: 4px ridge #cf9d38;
            margin: 10px 0;
            display: block;
        }

        .message-box {
            font-size: 17px; background: rgba(0,0,0,0.4); 
            padding: 15px; border-radius: 10px; 
            border-top: 3px solid #cf9d38; margin-bottom: 15px;
        }

        .input-section { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 20px; border-radius: 15px;
            border: 1px solid rgba(207, 157, 56, 0.3);
        }

        input[type="text"] { 
            width: 80%; padding: 12px; border-radius: 25px; 
            border: 2px solid #cf9d38; margin-bottom: 15px; 
            text-align: center; background: #000; color: #fff;
        }

        .share-btn {
            background: linear-gradient(45deg, #cf9d38, #ffefbb);
            color: #00251a; border: none; padding: 12px 25px; 
            font-size: 18px; border-radius: 50px; cursor: pointer;
            font-weight: bold; width: 100%;
        }
    </style>
</head>
<body>

    <div class="falling-container" id="stars"></div>

    <div class="container">

        <!-- TOP AD -->
        <div class="ad-slot">
            <script type="text/javascript">
                atOptions = { 'key' : '5c746cb8a6fea61554b0a61eaca13955', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
            </script>
            <script type="text/javascript" src="//www.highperformanceformat.com/5c746cb8a6fea61554b0a61eaca13955/invoke.js"></script>
        </div>

        <div class="from-name" id="displayName">Hasnain</div>
        <h1 class="main-wish">Eid Mubarak</h1>

        <!-- GIF (Lazy load added for speed) -->
        <img src="eid.gif" alt="Eid Mubarak" class="eid-gif" loading="lazy">

        <div class="message-box">
            🌙 Allah aapko dheron khushiyan, <br>
            sehat aur kamyabi ata farmaye. <br>
            <strong>Ameen!</strong>
        </div>

        <div class="input-section">
            <p style="margin-top:0; font-size:14px;">Apna Naam likhein aur doston ko bhejein 👇</p>
            <input type="text" id="nameInput" placeholder="Yahan Naam Likhein...">
            <button class="share-btn" onclick="shareToWhatsApp()">📲 WhatsApp Par Bhejein</button>
        </div>

        <!-- BOTTOM AD -->
        <div class="ad-slot">
            <!-- Tip: Niche wale ad ke liye dusri Key use karein agar ye show na ho -->
            <script type="text/javascript">
                atOptions = { 'key' : '5c746cb8a6fea61554b0a61eaca13955', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
            </script>
            <script type="text/javascript" src="//www.highperformanceformat.com/5c746cb8a6fea61554b0a61eaca13955/invoke.js"></script>
        </div>

        <p style="font-size: 10px; margin-top: 20px; opacity: 0.5;">✨ Design by Hasnain Mansoori ✨</p>
    </div>

    <script>
        // Efficient Star animation (Kam elements = Zyada speed)
        function createStars() {
            const container = document.getElementById('stars');
            const symbols = ['⭐', '🌙', '✨'];
            for (let i = 0; i < 20; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                star.style.left = Math.random() * 100 + 'vw';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        }
        window.onload = createStars;

        const urlParams = new URLSearchParams(window.location.search);
        const senderName = urlParams.get('n');
        if (senderName) { document.getElementById('displayName').innerText = senderName + " ki taraf se"; }

        function shareToWhatsApp() {
            var name = document.getElementById("nameInput").value;
            if (name == "") { alert("Pehle apna naam likhein!"); return; }
            var currentUrl = window.location.href.split('?')[0];
            var shareUrl = currentUrl + "?n=" + encodeURIComponent(name);
            var message = "🌙 *" + name + "* ki taraf se aapko *Eid Mubarak* ho aur aapki sabhi duaein qubool hon, Ameen! ✨\n\nPura message padhne ke liye niche click karein...\n👇👇👇\n" + shareUrl;
            window.location.href = "whatsapp://send?text=" + encodeURIComponent(message);
        }
    </script>
</body>
</html>
