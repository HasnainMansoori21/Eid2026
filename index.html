<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak 2026 Special</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle, #004d40, #00251a);
            color: white; font-family: 'Poppins', sans-serif;
            text-align: center; overflow-x: hidden;
            min-height: 100vh;
        }

        /* Ad Container Styling */
        .ad-container {
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px; /* Ad height ke barabar */
            width: 100%;
        }

        .falling-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .star {
            position: absolute; color: rgba(255, 215, 0, 0.8);
            font-size: 20px; animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .container { 
            position: relative; z-index: 1;
            max-width: 500px; margin: auto; padding: 10px; 
        }

        .from-name { 
            font-size: 26px; color: #ffeb3b; margin-top: 10px; 
            text-transform: uppercase; font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .main-wish { 
            font-family: 'Great Vibes', cursive;
            font-size: 70px; margin: 15px 0;
            background: linear-gradient(to bottom, #cf9d38 22%, #ffefbb 45%, #cf9d38 50%, #ffefbb 63%, #cf9d38 82%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.5));
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .eid-gif { 
            width: 100%; border-radius: 20px; 
            border: 5px ridge #cf9d38;
            box-shadow: 0 0 30px rgba(207, 157, 56, 0.5);
            margin: 10px 0;
        }

        .message-box {
            font-size: 18px; line-height: 1.6; color: #f0f0f0;
            background: rgba(0,0,0,0.4); padding: 20px;
            border-radius: 15px; border-top: 3px solid #cf9d38;
            margin-bottom: 20px;
        }

        .input-section { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 25px; border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(207, 157, 56, 0.4);
        }

        input[type="text"] { 
            width: 85%; padding: 15px; border-radius: 30px; 
            border: 2px solid #cf9d38; font-size: 16px; 
            margin-bottom: 20px; text-align: center;
            background: rgba(0,0,0,0.6); color: white;
        }

        .share-btn {
            background: linear-gradient(45deg, #cf9d38, #ffefbb);
            color: #00251a; border: none; padding: 15px 30px; 
            font-size: 20px; border-radius: 50px; cursor: pointer;
            font-weight: bold; width: 100%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="falling-container" id="stars"></div>

    <div class="container">

        <!-- TOP AD (300x250) -->
        <div class="ad-container">
            <script type="text/javascript">
                atOptions = {
                    'key' : '5c746cb8a6fea61554b0a61eaca13955',
                    'format' : 'iframe',
                    'height' : 250,
                    'width' : 300,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/5c746cb8a6fea61554b0a61eaca13955/invoke.js"></script>
        </div>

        <div class="from-name" id="displayName">Hasnain</div>
        <h1 class="main-wish">Eid Mubarak</h1>

        <!-- Local GIF File -->
        <img src="eid.gif" alt="Eid Mubarak" class="eid-gif">

        <div class="message-box">
            🌙 Allah aapko dheron khushiyan, <br>
            sehat aur kamyabi ata farmaye. <br>
            <strong>Ameen!</strong>
        </div>

        <div class="input-section">
            <p style="margin-top:0;">Apna Naam likhein aur doston ko apne naam ka Eid Mubarak message bhejein 👇</p>
            <input type="text" id="nameInput" placeholder="Yahan Apna Naam Likhein...">
            <button class="share-btn" onclick="shareToWhatsApp()">📲 WhatsApp Par Bhejein</button>
        </div>

        <!-- BOTTOM AD (300x250) -->
        <div class="ad-container">
            <script type="text/javascript">
                atOptions = {
                    'key' : '5c746cb8a6fea61554b0a61eaca13955',
                    'format' : 'iframe',
                    'height' : 250,
                    'width' : 300,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/5c746cb8a6fea61554b0a61eaca13955/invoke.js"></script>
        </div>

        <p style="font-size: 12px; margin-top: 30px; opacity: 0.5;">✨ Design by Hasnain Mansoori ✨</p>
    </div>

    <script>
        // Star animation logic
        function createStars() {
            const container = document.getElementById('stars');
            const symbols = ['⭐', '🌙', '✨'];
            for (let i = 0; i < 35; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                star.style.left = Math.random() * 100 + 'vw';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        }
        createStars();

        // Get name from URL
        const urlParams = new URLSearchParams(window.location.search);
        const senderName = urlParams.get('n');
        if (senderName) {
            document.getElementById('displayName').innerText = senderName + " ki taraf se";
        }

        // WhatsApp Share logic
        function shareToWhatsApp() {
            var name = document.getElementById("nameInput").value;
            if (name == "") {
                alert("Pehle apna naam likhein!");
                return;
            }
            
            var currentUrl = window.location.href.split('?')[0];
            var shareUrl = currentUrl + "?n=" + encodeURIComponent(name);
            
            var message = "🌙 *" + name + "* ki taraf se aapko *Eid Mubarak* ho aur aapki sabhi duaein qubool hon, Ameen! ✨\n\nPura message padhne ke liye niche click karein...\n👇👇👇\n" + shareUrl;
            
            window.location.href = "whatsapp://send?text=" + encodeURIComponent(message);
        }
    </script>
</body>
</html>
